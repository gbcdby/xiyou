<text x="30" y="1655" class="small">R03 是常驻见证人；R10 会面、R07 等待、R11 出发各自独立，不能以承诺代替到达。</text>
<text x="30" y="1689" class="small">C20↔R01 为唯一院落/短路连接；入场分别落在 R02/C21，保持原移动与计划合法性。</text>
<text x="30" y="1755" class="small">精确多边形、障碍尺度、条件和引用以 spatial-layout.json 为准；本图不授予玩家全知视野。</text><text x="30" y="1785" class="small">设计自查与正式运行分开；图像缺失时，原生标注仍可审阅，不能声称原背景已恢复。</text></svg>