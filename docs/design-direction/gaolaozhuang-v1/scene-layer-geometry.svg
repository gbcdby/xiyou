<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1570" viewBox="0 0 1460 1570" role="img" aria-labelledby="title desc">
<title id="title">首章室内分层技术导图：事实与已采纳设计</title>
<desc id="desc">仅为作者几何导图，背景沿用已有原图。青色区域与编号点来自内容；橙色是现有门碰撞；紫色制作窗及深度线是已采纳设计参数，不是新增世界几何或最终美术；导图不证明运行或艺术验收。</desc>
<rect width="1460" height="1570" fill="#f6f3e9"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="32" y="46" font-size="30" fill="#253c40" >首章室内与门 · 精确几何导图</text>
<text x="32" y="80" font-size="18" fill="#253c40" >事实：scene-v2 / gaolao-layout-v1.1　　设计：静态空剖面 + 门扇二态 / 中性遮片 + 最小入口前景</text>
<text x="32" y="109" font-size="17" fill="#665c50" >作者技术输入，非最终水墨美术；全部坐标为世界单位。淡底是既有原图，尚未按本方案修复。</text>
<text x="32" y="145" font-size="22" fill="#253c40" >A  后宅：先解决 C07 两私物落在门板的问题</text>
