<text x="45" y="1500" font-size="17" fill="#253c40" >C12 (645,285) → C11 (645,350) → C13 (645,390)</text>
<text x="802" y="1500" font-size="17" fill="#253c40" >R05 (575,255) → R04 (575,325) → R06 (575,405)</text>
<text x="32" y="1534" font-size="17" fill="#665c50" >没有新增房间权限、闭门状态、碰撞或通道；背景最终只留静态环境，角色与物件仍按授权 view 独立绘制。</text>
</g></svg>
