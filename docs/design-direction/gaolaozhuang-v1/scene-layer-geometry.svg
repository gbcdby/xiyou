ext x="1255" y="320" font-size="9" fill="#214d84" >C08</text><circle cx="1110" cy="320" r="2.8" fill="#214d84"/><text x="1115" y="315" font-size="9" fill="#214d84" >C09</text><path d="M1250 359 L1256 365 L1250 371 L1244 365 Z" fill="#b9712f" stroke="white" stroke-width="1"/><text x="1258" y="368" font-size="9" fill="#8b5429" >门图</text><line x1="1250" y1="371" x2="1250" y2="422" stroke="#8b5429" stroke-width="0.8" stroke-dasharray="2 2"/></svg>
<text x="840" y="196" font-size="23" fill="#253c40" >事实边界</text>
<text x="840" y="230" font-size="18" fill="#253c40" >rear-room：1160..1360 × 250..335</text>
<text x="840" y="257" font-size="18" fill="#253c40" >侧廊：1095..1160 × 290..335</text>
<text x="840" y="284" font-size="18" fill="#253c40" >门道：1215..1285 × 335..415（宽70）</text>
<text x="840" y="311" font-size="18" fill="#253c40" >门碰撞：1210..1290 × 350..395</text>
<text x="840" y="338" font-size="18" fill="#253c40" >C07 = (1320,300)，两件同点，禁止移位</text>
<text x="840" y="365" font-size="18" fill="#253c40" >C01 = (1250,425)，操作与导航仍用此点</text>
<text x="840" y="392" font-size="18" fill="#253c40" >◇ 门图 = (1250,365)，现有 offset=(0,-60)</text>
<text x="840" y="419" font-size="18" fill="#253c40" ></text>
<text x="840" y="446" font-size="23" fill="#253c40" >候选显示，不是新的世界事实</text>
<text x="840" y="480" font-size="17" fill="#253c40" >紫色外框：制作检查窗 [1070,150,350,280]</text>
<text x="840" y="507" font-size="17" fill="#253c40" >紫色短线：前沿 depthY=335；门槽=395</text>
<text x="840" y="534" font-size="17" fill="#253c40" >制作窗不等于 replaceMask 或可走范围</text>
<text x="840" y="561" font-size="17" fill="#253c40" >空室内静态显示；门态只取当前授权 target</text>
<text x="840" y="588" font-size="17" fill="#253c40" >看不见门：非写实中性遮片，不能画成开/闭</text>
<text x="840" y="615" font-size="17" fill="#253c40" >前景只分离必要小片，原底层须删掉重复像素</text>
<text x="840" y="642" font-size="18" fill="#253c40" ></text>
<text x="840" y="669" font-size="23" fill="#253c40" >图例</text>
<text x="840" y="703" font-size="17" fill="#253c40" >青色：内容内既有地面/通道多边形</text>
<text x="840" y="730" font-size="17" fill="#253c40" >蓝点：既有锚点；红双环：两实体同点</text>
<text x="840" y="757" font-size="17" fill="#253c40" >橙线：既有门碰撞，仅为技术事实标注</text>
<text x="840" y="784" font-size="17" fill="#253c40" >紫线：本轮视觉提案，不能用作碰撞</text>
<text x="32" y="840" font-size="22" fill="#253c40" >B  前院客房：固定敞开门，保留自由退出</text>
<text x="790" y="840" font-size="22" fill="#253c40" >C  茶棚后间：用内室替代原门洞远景</text>
